syntax = "proto3";

option go_package = "/;apigate";

import "google/api/annotations.proto";
import "http/http.proto";

service ApigateService {
	rpc Home (http.ResponseWriter) returns (http.Request) {
		option (google.api.http) = {
			get: "/" // expose httpApi
			authorization: false
			body: "*"
		};
	}
	rpc Favicon (http.ResponseWriter) returns (http.Request) {
		option (google.api.http) = {
			get: "/favicon.ico" // expose httpApi
			authorization: false
			body: "*"
		};
	}
}
