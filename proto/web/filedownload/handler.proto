syntax = "proto3";

option go_package = "/;web/filedownload";

import "google/api/annotations.proto";
import "http/http.proto";

service FileDownloadService {
	rpc Download (http.ResponseWriter) returns (http.Request) {
		option (google.api.http) = {
			get: "/download" // expose httpApi
			authorization: false
			body: "*"
		};
	}
}