syntax = "proto3";

option go_package = "/;web/upload";

import "google/api/annotations.proto";
import "http/http.proto";

service UploadService {
	rpc Activitys (http.ResponseWriter) returns (http.Request) {
		option (google.api.http) = {
			post: "/Activitys" // expose httpApi
			authorization: false
			body: "*"
		};
	}
}
